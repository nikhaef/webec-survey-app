<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Umfrage</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<div class="container">
    <h1 th:text="${survey.title}"></h1>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{'/survey/' + ${survey.id} + '/submit'}" method="post">
        <div th:each="q, qi : ${survey.questions}">
            <div class="question">
                <p><strong th:text="${q.text}"></strong></p>
                <div th:each="opt : ${q.options}">
                    <label>
                        <input type="radio" th:name="${'q' + q.id}" th:value="${opt.id}" />
                        <span th:text="${opt.text}"></span>
                    </label>
                </div>
            </div>
        </div>
        <p>
            <button class="btn" type="submit">Submit</button>
            <a class="btn secondary" href="/">Cancel</a>
        </p>
    </form>
</div>
</body>
</html>
