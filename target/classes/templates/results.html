<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ergebnisse</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
<div class="container">
    <h1 th:text="${survey.title}"></h1>
    <p>Antworten gesamt: <strong th:text="${responsesCount}"></strong></p>
    <div th:if="${responsesCount == 0}" class="error">Noch keine Antworten eingegangen.</div>
    <div th:each="q : ${survey.questions}">
        <h3 th:text="${q.text}"></h3>
        <table>
            <colgroup>
                <col style="width:70%" />
                <col style="width:30%" />
            </colgroup>
            <thead><tr><th>Option</th><th style="text-align:center">Anzahl</th></tr></thead>
            <tbody>
            <tr th:each="opt : ${q.options}" th:style="${bgMap[q.id][opt.id] != null} ? 'background-color:' + bgMap[q.id][opt.id] : ''">
                <td th:text="${opt.text}"></td>
                <td style="text-align:center" th:text="${counts[q.id][opt.id] != null ? counts[q.id][opt.id] : 0}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <p><a class="btn" href="/">Zurück</a></p>
</div>
</body>
</html>
